name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  test:
    name: RiveViewerKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: make test

  build:
    name: App build (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -project RiveViewer.xcodeproj -scheme RiveViewer -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build -quiet
