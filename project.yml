name: RiveViewer
options:
  bundleIdPrefix: no.olafandreas
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  RiveViewerKit:
    path: Packages/RiveViewerKit
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    exactVersion: 6.28.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Signed with the owner's team so Xcode Cloud can archive and notarize a Developer ID build.
    # To build under another team, change DEVELOPMENT_TEAM (and the bundle id prefix above).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: J69ZPVRMCE
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RiveViewer:
    type: application
    platform: macOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - RiveViewer
    info:
      path: RiveViewer/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: RiveViewer
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Rive Animation
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.rive.riv]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.rive.riv
            UTTypeDescription: Rive Animation
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [riv]
    dependencies:
      - package: RiveViewerKit
      - package: RiveRuntime
      - target: RiveQuickLook
      - target: RiveThumbnail
    scheme:
      testTargets:
        - package: RiveViewerKit/RiveViewerKitTests
  RiveQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - RiveQuickLook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.olafandreas.RiveViewer.QuickLook
    info:
      path: RiveQuickLook/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            QLSupportedContentTypes: [app.rive.riv]
            QLSupportsSearchableItems: false
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
    entitlements:
      path: RiveQuickLook/RiveQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - package: RiveViewerKit
      - package: RiveRuntime
  RiveThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - RiveThumbnail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.olafandreas.RiveViewer.Thumbnail
    info:
      path: RiveThumbnail/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            QLSupportedContentTypes: [app.rive.riv]
            QLThumbnailMinimumDimension: 0
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
    entitlements:
      path: RiveThumbnail/RiveThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - package: RiveViewerKit
      - package: RiveRuntime
